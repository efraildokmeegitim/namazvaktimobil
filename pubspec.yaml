name: sukun_app
description: "SÜKÛN: Gelişmiş Namaz Vakti, İlmi Akış ve İslami Yaşam Platformu"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Offline Database (SQLite + FTS5)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Prayer Times & Astronomical Engine
  adhan: ^2.0.0-nullsafety.1
  intl: ^0.19.0
  geolocator: ^12.0.0

  # Common UI, Icons, Shared Storage
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift Code Generator
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/seed_data/
    - assets/fonts/

  fonts:
    - family: HafizOsman
      fonts:
        - asset: assets/fonts/KuranKerimFontHamdullah.ttf
    - family: HayratNesih
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
